services:
  postgres:
    image: postgres:17
    container_name: pe-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poc123}
      POSTGRES_DB: PayrollEngine
      POSTGRES_USER: ${POSTGRES_USER:-payroll}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pe-postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payroll} -d PayrollEngine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pe-postgres-data:
